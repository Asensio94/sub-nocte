name: forecast

# Every morning: forecast for the next seven nights, per-city alert levels and a regenerated website.
# The site is published by GitHub Pages reading the root of this same branch, so a commit is enough:
# no Actions deployment and no extra permissions needed.

on:
  schedule:
    - cron: "20 5 * * *"   # 05:20 UTC ≈ 07:20 in Madrid, with the day's forecast already published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Forecast for the coming nights
        run: python -m subnocte.cli phase3 --days 7
        env:
          PYTHONIOENCODING: utf-8

      - name: Regenerate the website
        run: python -m subnocte.cli web
        env:
          PYTHONIOENCODING: utf-8

      - name: Publish if anything changed
        run: |
          git config user.name "sub-nocte"
          git config user.email "actions@github.com"
          git add index.html en .nojekyll data/phase3_forecast.csv output/phase3.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Forecast for $(date -u +%Y-%m-%d)"
            git push
          fi
